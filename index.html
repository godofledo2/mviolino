<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matheus | Violinista</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --vinho: #4a1c2a;
      --dourado: #c5a059;
      --creme: #fdf8f2;
      --marrom: #2d1a10;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top left, #4a1c2a 0%, #2d1a10 100%);
      color: var(--creme);
      overflow-x: hidden;
    }
    h1, h2, .serif {
      font-family: 'Playfair Display', serif;
    }
    .speech-bubble {
      position: relative;
      background: rgba(255, 255, 255, 0.95);
      color: #2d1a10;
      border-radius: 24px;
      padding: 1.5rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 16px 16px 0;
      border-style: solid;
      border-color: rgba(255,255,255,0.95) transparent transparent transparent;
    }
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: var(--dourado);
      margin-left: 2px;
      animation: blink 1s step-end infinite;
      vertical-align: middle;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    .avatar-float {
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .note {
      position: absolute;
      font-size: 1.5rem;
      color: rgba(197, 160, 89, 0.4);
      animation: floatNote 6s linear infinite;
      pointer-events: none;
    }
    @keyframes floatNote {
      0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }
    .social-btn {
      transition: all 0.3s ease;
    }
    .social-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(197, 160, 89, 0.3);
    }
    .music-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 50;
      width: 3rem;
      height: 3rem;
      border-radius: 50%;
      background: rgba(197, 160, 89, 0.9);
      color: #2d1a10;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .music-btn:hover {
      transform: scale(1.1);
      background: #c5a059;
    }
    .music-btn.muted {
      background: rgba(255, 255, 255, 0.2);
      color: #fdf8f2;
    }
    .sound-notice {
      position: fixed;
      bottom: 5rem;
      right: 1.5rem;
      z-index: 50;
      display: none;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-radius: 9999px;
      background: rgba(197, 160, 89, 0.95);
      color: #2d1a10;
      font-weight: 600;
      font-size: 0.875rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid rgba(255, 255, 255, 0.4);
      max-width: calc(100vw - 3rem);
    }
    .sound-notice:hover {
      transform: scale(1.05);
      background: #c5a059;
    }
    .sound-notice.show {
      display: flex;
      animation: pulseNotice 2s infinite;
    }
    .sound-notice-icon {
      font-size: 1.1rem;
    }
    .sound-notice-text {
      white-space: nowrap;
    }
    @keyframes pulseNotice {
      0%, 100% { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); }
      50% { box-shadow: 0 4px 24px rgba(197, 160, 89, 0.6); }
    }
  </style>
</head>

  <script>
    // Texto fixo do site
    const currentText = "Sou violinista e apaixonado por música. Toco nos mais diversos tipos de eventos, com um carinho especial por casamentos, que são, pra mim, um dos momentos mais emocionantes de se acompanhar com música.\n\nAqui você encontra meus covers, registros das minhas apresentações e um pouco da minha jornada com o violino.\n\nVamos nos conectar?";
    
    // Efeito de digitação
    const typedSpan = document.getElementById('typed-text');
    let charIndex = 0;
    
    function typeWriter() {
      if (charIndex < currentText.length) {
        typedSpan.textContent += currentText.charAt(charIndex);
        charIndex++;
        setTimeout(typeWriter, 35);
      }
    }
    
    // Criar notas musicais flutuantes
    function createNote() {
      const notes = ['♪', '♫', '♩', '♬', '♭', '♮'];
      const note = document.createElement('div');
      note.className = 'note';
      note.textContent = notes[Math.floor(Math.random() * notes.length)];
      note.style.left = Math.random() * 100 + 'vw';
      note.style.animationDuration = (4 + Math.random() * 6) + 's';
      note.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
      document.getElementById('notes-container').appendChild(note);
      
      setTimeout(() => note.remove(), 10000);
    }
    
    setInterval(createNote, 1200);
    
    // Controle da música de fundo
    const bgMusic = document.getElementById('bgMusic');
    const musicToggle = document.getElementById('musicToggle');
    const iconOn = document.getElementById('iconOn');
    const iconOff = document.getElementById('iconOff');
    let musicPlaying = false;

    function updateMusicIcon() {
      if (musicPlaying) {
        iconOn.classList.remove('hidden');
        iconOff.classList.add('hidden');
        musicToggle.classList.remove('muted');
      } else {
        iconOn.classList.add('hidden');
        iconOff.classList.remove('hidden');
        musicToggle.classList.add('muted');
      }
    }

    function toggleMusic() {
      if (bgMusic.paused) {
        bgMusic.play().then(() => {
          musicPlaying = true;
          updateMusicIcon();
        }).catch(() => {
          // Autoplay bloqueado ou arquivo não encontrado
          musicPlaying = false;
          updateMusicIcon();
        });
      } else {
        bgMusic.pause();
        musicPlaying = false;
        updateMusicIcon();
      }
    }

    const soundNotice = document.getElementById('soundNotice');

    function showSoundNotice() {
      if (soundNotice) soundNotice.classList.add('show');
    }

    function hideSoundNotice() {
      if (soundNotice) soundNotice.classList.remove('show');
    }

    function activateSound() {
      bgMusic.play().then(() => {
        musicPlaying = true;
        updateMusicIcon();
        hideSoundNotice();
      }).catch(() => {
        musicPlaying = false;
        updateMusicIcon();
      });
    }

    // Tenta iniciar a música automaticamente (pode ser bloqueado pelo navegador)
    window.addEventListener('load', () => {
      bgMusic.volume = 0.4; // volume suave
      bgMusic.play().then(() => {
        musicPlaying = true;
        updateMusicIcon();
        hideSoundNotice();
      }).catch(() => {
        // Autoplay bloqueado: mostra aviso ao usuário
        musicPlaying = false;
        updateMusicIcon();
        showSoundNotice();
      });
    });

    // Esconde o aviso se o usuário interagir com a página de outra forma
    document.addEventListener('click', (e) => {
      if (soundNotice && soundNotice.classList.contains('show') && e.target !== soundNotice && !soundNotice.contains(e.target) && e.target !== musicToggle && !musicToggle.contains(e.target)) {
        activateSound();
      }
    });

    // Iniciar
    typeWriter();
  </script>
